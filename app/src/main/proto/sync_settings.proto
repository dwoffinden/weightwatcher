edition = "2024";

option features.field_presence = IMPLICIT;
option java_package = "dev.daw.weightwatcher";

import "google/protobuf/timestamp.proto";

enum DataType {
  DATA_TYPE_UNSPECIFIED = 0;
  WEIGHT = 1;
  STEPS = 2;
  SLEEP = 3;
  EXERCISE = 4;
  HEART_RATE = 5;
  RESTING_HEART_RATE = 6;
  BODY_FAT = 7;
  VO2_MAX = 8;
  BLOOD_PRESSURE = 9;
  HEART_RATE_VARIABILITY = 10;
  OXYGEN_SATURATION = 11;
  RESPIRATORY_RATE = 12;
  SKIN_TEMPERATURE = 13;
  DISTANCE = 14;
  ACTIVE_CALORIES_BURNED = 15;
  TOTAL_CALORIES_BURNED = 16;
  FLOORS_CLIMBED = 17;
  ELEVATION_GAINED = 18;
  ACTIVITY_INTENSITY = 19;
  HYDRATION = 20;
  NUTRITION = 21;
  BLOOD_GLUCOSE = 22;
  MINDFULNESS = 23;
  HEIGHT = 24;
}

message DataTypeState {
  // Whether a sync is running isn't stored: see WeightWorker.isSyncing.
  enum Status {
    reserved 2;
    reserved SYNCING;

    STATUS_UNSPECIFIED = 0;
    OK = 1;
    NO_PERMISSIONS = 3;
  }

  string changes_token = 1;
  .google.protobuf.Timestamp last_record_time = 2;
  Status status = 3;
}

message SyncSettings {
  reserved 1, 2, 3;

  // Keyed by DataType number, since map keys can't be enums.
  map<int32, DataTypeState> states_by_type = 4;

  // Whether widgets placed before per-widget data types existed have been assigned WEIGHT.
  bool legacy_widgets_migrated = 5;
}
